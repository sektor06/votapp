<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VotApp SPM — Administración</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --blue:#1a56db;--blue-d:#0c3580;--blue-l:#e8f0fe;
  --green:#0a7c4a;--green-l:#e6f4ed;
  --red:#c0392b;--red-l:#fdecea;
  --amber:#b45309;--amber-l:#fef3c7;
  --purple:#6d28d9;--purple-l:#ede9fe;
  --g50:#f8f9fa;--g100:#f1f3f5;--g200:#e9ecef;
  --g400:#adb5bd;--g600:#6c757d;--g800:#343a40;--g900:#212529;
  --r:12px;--rs:8px;--sh:0 2px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:#0f172a}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* CADA PANTALLA OCUPA TODO EL VIEWPORT */
.page{
  position:fixed;inset:0;
  overflow-y:auto;overflow-x:hidden;
  display:none;
  animation:fadeIn .25s ease;
}
.page.active{display:block}

/* ── SPLASH ── */
#pg-splash{
  background:linear-gradient(160deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:2rem;text-align:center;
}
#pg-splash.active{display:flex !important}
.logo-mark{width:72px;height:72px;background:var(--blue);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-family:'DM Serif Display',serif;font-size:26px;color:#fff;box-shadow:0 8px 32px rgba(26,86,219,.4)}
.splash-h1{font-family:'DM Serif Display',serif;font-size:2.8rem;color:#fff;margin-bottom:.4rem}
.splash-h1 span{color:#60a5fa}
.splash-sub{color:rgba(255,255,255,.5);margin-bottom:2.5rem;font-size:.95rem}
.npills{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.npill{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;padding:14px 18px;border-radius:var(--r);display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .2s;text-align:left;width:100%}
.npill:hover{background:rgba(255,255,255,.13)}
.npill:active{transform:scale(.97)}
.pi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pi-p{background:rgba(109,40,217,.35)}
.pi-b{background:rgba(26,86,219,.35)}
.pt{font-size:14px;font-weight:600}
.ps{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px}
.saved-pill{width:100%;max-width:340px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;transition:background .2s}
.saved-pill:hover{background:rgba(255,255,255,.13)}
.saved-av{width:38px;height:38px;border-radius:99px;background:var(--blue-l);color:var(--blue);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.saved-name{font-size:14px;font-weight:600;color:#fff;flex:1}
.saved-role{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.enter-btn-splash{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
.dir-note{margin-top:1.5rem;font-size:11px;color:rgba(255,255,255,.3)}
.dir-note a{color:rgba(255,255,255,.45)}
.change-acc{background:none;border:none;color:rgba(255,255,255,.35);font-size:11px;cursor:pointer;font-family:inherit;margin-top:6px;text-decoration:underline;display:block;margin-left:auto;margin-right:auto}

/* ── LOGIN ── */
#pg-login-admin,#pg-login-cand{
  background:linear-gradient(160deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);
  flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;
}
#pg-login-admin.active,#pg-login-cand.active{display:flex !important}
.login-box{background:#fff;border-radius:20px;padding:1.75rem;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.35);animation:slideUp .3s ease}
.lb-mark{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:'DM Serif Display',serif;font-size:20px;color:#fff}
.lb-title{font-size:18px;font-weight:700;color:var(--g900);text-align:center}
.lb-sub{font-size:12px;color:var(--g600);text-align:center;margin-top:3px;margin-bottom:1.25rem}
.fl{font-size:11px;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.fi{width:100%;background:var(--g50);border:1.5px solid var(--g200);border-radius:var(--rs);padding:11px 14px;font-size:14px;color:var(--g900);font-family:inherit;outline:none;transition:border-color .15s;margin-bottom:10px}
.fi:focus{border-color:var(--blue);background:#fff}
.login-err{background:var(--red-l);color:var(--red);border-radius:var(--rs);padding:9px 12px;font-size:12px;font-weight:600;margin-bottom:10px;display:none}
.btn-full{width:100%;border:none;border-radius:var(--rs);padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-full:active{transform:scale(.98)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-d)}
.btn-green{background:var(--green);color:#fff}
.switch-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.switch-row span{font-size:12px;color:var(--g600)}
.switch-row button{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;font-weight:700;font-family:inherit}
.back-row{text-align:center;margin-top:10px}
.back-row button{font-size:12px;color:var(--g600);background:none;border:none;cursor:pointer;font-family:inherit}

/* ── PANEL SCREENS ── */
#pg-admin,#pg-cand{background:var(--g50)}
#pg-admin.active,#pg-cand.active{display:flex !important;flex-direction:column}

/* HEADER */
.hdr{background:#fff;padding:14px 16px;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:var(--sh)}
.hdr-info{flex:1;min-width:0}
.hdr-title{font-size:15px;font-weight:700;color:var(--g900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:11px;color:var(--g600);margin-top:1px}
.logout-btn{background:var(--red-l);color:var(--red);border:none;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;flex-shrink:0}
.logout-btn:active{opacity:.8}

/* CONTENT */
.panel-body{flex:1;overflow-y:auto;padding:14px}

/* TABS */
.tabs{display:flex;background:var(--g100);border-radius:10px;padding:3px;margin-bottom:14px}
.tab{flex:1;padding:8px 4px;text-align:center;font-size:12px;color:var(--g600);border-radius:8px;cursor:pointer;font-weight:500;transition:all .15s}
.tab.on{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* CARDS */
.card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.card-title{font-size:13px;font-weight:700;color:var(--g900);margin-bottom:12px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metric{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.metric.ac{background:var(--blue)}
.ml{font-size:11px;color:var(--g600);margin-bottom:4px}
.metric.ac .ml{color:rgba(255,255,255,.7)}
.mv{font-size:24px;font-weight:700;color:var(--g900);line-height:1}
.metric.ac .mv{color:#fff}
.ms{font-size:11px;margin-top:3px;color:var(--g600)}
.metric.ac .ms{color:rgba(255,255,255,.6)}

/* PILLS */
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600}
.pg{background:var(--green-l);color:var(--green)}
.pb{background:var(--blue-l);color:var(--blue)}
.pa{background:var(--amber-l);color:var(--amber)}
.pr{background:var(--red-l);color:var(--red)}
.pgr{background:var(--g100);color:var(--g600)}

/* LIST */
.lrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--g100)}
.lrow:last-child{border-bottom:none}
.lav{width:36px;height:36px;border-radius:99px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av-b{background:var(--blue-l);color:var(--blue)}
.av-g{background:var(--green-l);color:var(--green)}
.lname{font-size:13px;font-weight:600;color:var(--g900)}
.lsub{font-size:11px;color:var(--g600);margin-top:1px}
.lval{font-size:15px;font-weight:700;color:var(--g900);text-align:right}
.lhoy{font-size:10px;color:var(--green);text-align:right}

/* BUTTONS */
.btn{border:none;border-radius:var(--rs);padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:active{transform:scale(.97)}
.btn-blue-sm{background:var(--blue);color:#fff}
.btn-gray{background:var(--g100);color:var(--g800)}
.btn-amber{background:var(--amber-l);color:var(--amber)}
.btn-green-sm{background:var(--green-l);color:var(--green)}
.btn-red{background:var(--red-l);color:var(--red)}

/* FORMS */
.fg{margin-bottom:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select.fi{appearance:none;-webkit-appearance:none}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex;animation:fadeIn .2s ease}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:92vh;overflow-y:auto;animation:slideUp .3s ease}
.mhandle{width:40px;height:4px;background:var(--g200);border-radius:99px;margin:0 auto 16px}
.mtitle{font-size:16px;font-weight:700;color:var(--g900);margin-bottom:16px}
.mactions{display:flex;gap:8px;margin-top:14px}

/* QR */
.qr-center{text-align:center;padding:.5rem}

/* TOAST */
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9998;width:calc(100% - 32px);max-width:380px;pointer-events:none}
.toast{border-radius:var(--rs);padding:12px 16px;font-size:13px;font-weight:600;display:none;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.toast.show{display:flex;animation:slideUp .2s ease}
.t-ok{background:var(--green-l);color:var(--green)}
.t-err{background:var(--red-l);color:var(--red)}

/* MISC */
.spinner{width:26px;height:26px;border:2.5px solid var(--g200);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
.empty{text-align:center;padding:2rem 1rem;color:var(--g400);font-size:13px}
.prog-bg{height:6px;background:var(--g200);border-radius:99px;overflow:hidden;margin:6px 0}
.prog-fill{height:100%;border-radius:99px;background:var(--blue)}
.search-fi{width:100%;background:#fff;border:1.5px solid var(--g200);border-radius:var(--rs);padding:10px 13px;font-size:14px;color:var(--g900);font-family:inherit;outline:none;margin-bottom:12px}
.search-fi:focus{border-color:var(--blue)}
</style>
</head>
<body>

<!-- TOAST GLOBAL -->
<div class="toast-wrap">
  <div class="toast t-ok" id="toast-ok"></div>
  <div class="toast t-err" id="toast-err"></div>
</div>

<!-- ══════════ SPLASH ══════════ -->
<div class="page" id="pg-splash" style="display:flex">
  <div class="logo-mark">VA</div>
  <h1 class="splash-h1">Vot<span>App</span></h1>
  <p class="splash-sub">Panel de gestión · San Pedro de Macorís 2028</p>
  <div id="splash-saved"></div>
  <div class="npills" id="splash-options">
    <button class="npill" onclick="goPage('pg-login-admin')">
      <div class="pi pi-p"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="white" stroke-width="1.5"/></svg></div>
      <div><div class="pt">Entrar al panel de administración</div><div class="ps">Gestionar candidatos · métricas globales</div></div>
      <div style="color:rgba(255,255,255,.3);font-size:18px;margin-left:auto">›</div>
    </button>
  </div>

</div>

<!-- ══════════ LOGIN ADMIN ══════════ -->
<div class="page" id="pg-login-admin">
  <div class="login-box">
    <div class="lb-mark" style="background:var(--purple)">VA</div>
    <div class="lb-title">Panel Superadmin</div>
    <div class="lb-sub">VotApp SPM 2028</div>
    <div class="login-err" id="err-adm"></div>
    <label class="fl">Email</label>
    <input class="fi" id="adm-email" type="email" placeholder="tu@email.com" autocomplete="email">
    <label class="fl">Contraseña</label>
    <input class="fi" id="adm-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn-full btn-blue" onclick="doLogin('admin')" id="adm-btn">Entrar al panel</button>
    
    <div class="back-row"><button onclick="goPage('pg-splash')">← Volver al inicio</button></div>
  </div>
</div>

<!-- ══════════ PANEL ADMIN ══════════ -->
<div class="page" id="pg-admin">
  <div class="hdr">
    <div class="hdr-info"><div class="hdr-title">Mi Panel — Superadmin</div><div class="hdr-sub">VotApp SPM</div></div>
    <button class="logout-btn" onclick="doLogout()">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M5 2H2v9h3M9 9l3-2.5L9 4M12 6.5H5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Salir
    </button>
  </div>
  <div class="panel-body">
    <div class="tabs">
      <div class="tab on" onclick="saTab('candidatos',this)">Candidatos</div>
      <div class="tab" onclick="saTab('metricas',this)">Métricas</div>
    </div>
    <div id="sa-candidatos">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span id="sa-count" style="font-size:12px;color:var(--g600)">Cargando...</span>
        <button class="btn btn-blue-sm" onclick="openModal('mc')">+ Nuevo candidato</button>
      </div>
      <div id="sa-lista"><div style="padding:2rem;text-align:center"><div class="spinner"></div></div></div>
    </div>
    <div id="sa-metricas" style="display:none">
      <div class="metrics">
        <div class="metric ac"><div class="ml">Candidatos</div><div class="mv" id="m-cands">-</div></div>
        <div class="metric"><div class="ml">Dirigentes</div><div class="mv" id="m-dirs">-</div></div>
        <div class="metric"><div class="ml">Votantes</div><div class="mv" id="m-vots">-</div></div>
        <div class="metric"><div class="ml">Hoy</div><div class="mv" id="m-hoy">-</div></div>
      </div>
      <div class="card"><div class="card-title">Actividad por candidato</div><div id="sa-act"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>

<!-- ══════════ MODAL NUEVO CANDIDATO ══════════ -->
<div class="modal-bg" id="mc">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mtitle">Nuevo candidato</div>
    <div class="fg"><label class="fl">Nombre completo *</label><input class="fi" id="mc-nom" placeholder="Ej. Rafael Peralta Jiménez"></div>
    <div class="row2">
      <div class="fg"><label class="fl">Partido</label><input class="fi" id="mc-par" placeholder="PRM, PLD..."></div>
      <div class="fg"><label class="fl">Cargo</label><input class="fi" id="mc-car" placeholder="Senador..."></div>
    </div>
    <div class="fg"><label class="fl">Email *</label><input class="fi" id="mc-ema" type="email" placeholder="correo@ejemplo.com"></div>
    <div class="fg"><label class="fl">Teléfono</label><input class="fi" id="mc-tel" placeholder="809-000-0000"></div>
    <div class="fg"><label class="fl">Meta de votantes</label><input class="fi" id="mc-met" type="number" placeholder="15000"></div>
    <div class="mactions">
      <button class="btn btn-gray" style="flex:1" onclick="closeModal('mc')">Cancelar</button>
      <button class="btn btn-blue-sm" style="flex:2" onclick="crearCandidato()">Crear candidato</button>
    </div>
  </div>
</div>


<script>
const SB_URL='https://izyqrakicqqdzgdlmxfb.supabase.co';
const SB_KEY='sb_publishable_LxVGpJqr_dwbcC3F5I8gfQ_j2O4UZ-H';
const db=supabase.createClient(SB_URL,SB_KEY);

const SECTORES={
  'San Pedro de Macorís':['Miramar','Restauración','Centro de la Ciudad','Villa Providencia','Japón','Villa Velázquez','Libertad','México','Ingenio Porvenir','Ingenio Santa Fe','Villa Progreso','Placer Bonito','Lindo','Blanco','Villa Faro','Toconal','Sarmiento','24 de Abril','Boca del Soco','Ingenio Angelina','Villa Olímpica','Punta Garza'],
  'Consuelo':['Centro de la Ciudad','Batey Central','Sueño Real','Alejandro Bass','Don Juan','La Aviación','Los Chicharrones'],
  'Quisqueya':['Centro de la Ciudad','Ulloa','Canutillo','La Ciria','Los Montones'],
  'Guayacanes':['Centro de la Ciudad','Juan Dolio','Los Conucos','Honduras','Hoyo del Toro','H-3 Los Solares','Los Bancos de Arena','Cruce de Cayacoa'],
  'Los Llanos':['Centro de la Ciudad','Batey Cayacoa','Batey Paloma','El Puerto','Gautier','El Guayabal','Batey Contador','La Estrella','Tintero','El Coco','El Bronce','El Rancho','Caimito','Cayacoita','Consuelito','Saca Turrón','San José'],
  'Ramón Santana':['Centro de la Ciudad','Batey El Soco','Batey La Cubana','Batey Los Arados','Batey Campiña','Batey Jagual','Batey La Margarita','Cabeza de Toro','Paso del Medio','Laguna Prieta','Plumita Regajo'],
  'Sabana Grande de Palenque':['Centro de la Ciudad']
};

let role=null,candId=null,candData=null;

// ── NAVIGATION ──
function goPage(id){
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.remove('active');
    p.style.display='none';
  });
  const el = document.getElementById(id);
  el.classList.add('active');
  // Determine correct display type
  if(id==='pg-splash' || id==='pg-login-admin' || id==='pg-login-cand'){
    el.style.display='flex';
  } else {
    el.style.display='flex';
  }
  window.scrollTo(0,0);
}

// ── SAVED SESSION ──
function initSavedSession(){
  const saved=localStorage.getItem('votapp_cand');
  if(!saved) return;
  try{
    const s=JSON.parse(saved);
    const ini=s.nombre.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    const wrap=document.getElementById('splash-saved');
    wrap.innerHTML=`
      <div style="width:100%;max-width:340px;margin-bottom:12px">
        <div class="saved-pill" onclick="entrarGuardado()">
          <div class="saved-av">${ini}</div>
          <div style="flex:1">
            <div class="saved-name">${s.nombre}</div>
            <div class="saved-role">${s.partido||''} · ${s.cargo||''}</div>
          </div>
          <div class="enter-btn-splash">Entrar</div>
        </div>
        <div style="text-align:center">
          <button class="change-acc" onclick="borrarSesion()">Entrar con otra cuenta</button>
        </div>
      </div>`;
    // Hide the regular options when saved session exists
    document.getElementById('splash-options').style.display='none';
  }catch(e){}
}



// ── LOGIN ──
async function doLogin(r){
  const isA=r==='admin';
  const email=document.getElementById(isA?'adm-email':'cnd-email').value.trim();
  const pass=document.getElementById(isA?'adm-pass':'cnd-pass').value;
  const errEl=document.getElementById(isA?'err-adm':'err-cnd');
  const btn=document.getElementById(isA?'adm-btn':'cnd-btn');
  errEl.style.display='none';
  if(!email||!pass){errEl.textContent='Ingresa email y contraseña';errEl.style.display='block';return;}
  btn.textContent='Verificando...';btn.disabled=true;
  const {data,error}=await db.auth.signInWithPassword({email,password:pass});
  btn.textContent=isA?'Entrar al panel':'Entrar a mi panel';btn.disabled=false;
  if(error){errEl.textContent='Email o contraseña incorrectos';errEl.style.display='block';return;}
  if(isA){
    role='admin';
    goPage('pg-admin');
    loadAdminCands();
  } else {
    const {data:cand}=await db.from('candidatos').select('*').eq('email',email).single();
    if(!cand){errEl.textContent='No hay candidato con ese email';errEl.style.display='block';await db.auth.signOut();return;}
    localStorage.setItem('votapp_cand',JSON.stringify({id:cand.id,nombre:cand.nombre,partido:cand.partido||'',cargo:cand.cargo||'',meta_total:cand.meta_total||0}));
    setupCand(cand);
  }
}


function doLogout(){
  db.auth.signOut();
  role=null;candId=null;candData=null;
  goPage('pg-splash');
  initSavedSession();
}

// ── TABS ──
function saTab(t,el){
  document.querySelectorAll('#pg-admin .tab').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('sa-candidatos').style.display=t==='candidatos'?'block':'none';
  document.getElementById('sa-metricas').style.display=t==='metricas'?'block':'none';
  if(t==='metricas') loadMetricas();
}

// ── MODALS ──
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

// ── TOAST ──
function toast(t,msg){
  const el=document.getElementById('toast-'+t);
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}

// ── ADMIN ──
async function loadAdminCands(){
  const {data}=await db.from('candidatos').select('*').order('created_at',{ascending:false});
  const lista=document.getElementById('sa-lista');
  document.getElementById('sa-count').textContent=(data?.length||0)+' candidatos';
  if(!data||!data.length){lista.innerHTML='<div class="empty">No hay candidatos. Crea el primero.</div>';return;}
  lista.innerHTML='';
  for(const c of data){
    const {count:vc}=await db.from('votantes').select('*',{count:'exact',head:true}).eq('candidato_id',c.id);
    const {count:dc}=await db.from('dirigentes').select('*',{count:'exact',head:true}).eq('candidato_id',c.id);
    const pct=c.meta_total?Math.round((vc||0)/c.meta_total*100):0;
    const ini=c.nombre.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="lav av-b">${ini}</div>
        <div><div class="lname">${c.nombre}</div><div class="lsub">${c.partido||''} · ${c.cargo||''}</div></div>
      </div>
      <span class="pill ${c.activo?'pg':'pgr'}">${c.activo?'Activo':'Inactivo'}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
      <div style="text-align:center;background:var(--g50);border-radius:6px;padding:8px"><div style="font-size:18px;font-weight:700">${vc||0}</div><div style="font-size:10px;color:var(--g600)">Votantes</div></div>
      <div style="text-align:center;background:var(--g50);border-radius:6px;padding:8px"><div style="font-size:18px;font-weight:700">${dc||0}</div><div style="font-size:10px;color:var(--g600)">Dirigentes</div></div>
      <div style="text-align:center;background:var(--g50);border-radius:6px;padding:8px"><div style="font-size:18px;font-weight:700;color:var(--blue)">${pct}%</div><div style="font-size:10px;color:var(--g600)">Meta</div></div>
    </div>
    <div class="prog-bg"><div class="prog-fill" style="width:${Math.min(pct,100)}%"></div></div>`;
    lista.appendChild(d);
  }
}

async function loadMetricas(){
  const {count:c1}=await db.from('candidatos').select('*',{count:'exact',head:true});
  const {count:c2}=await db.from('dirigentes').select('*',{count:'exact',head:true});
  const {count:c3}=await db.from('votantes').select('*',{count:'exact',head:true});
  const today=new Date().toISOString().split('T')[0];
  const {count:c4}=await db.from('votantes').select('*',{count:'exact',head:true}).gte('created_at',today);
  document.getElementById('m-cands').textContent=c1||0;
  document.getElementById('m-dirs').textContent=c2||0;
  document.getElementById('m-vots').textContent=c3||0;
  document.getElementById('m-hoy').textContent=c4||0;
  const {data}=await db.from('candidatos').select('id,nombre');
  const act=document.getElementById('sa-act');act.innerHTML='';
  for(const c of(data||[])){
    const {count}=await db.from('votantes').select('*',{count:'exact',head:true}).eq('candidato_id',c.id);
    const ini=c.nombre.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    const r=document.createElement('div');r.className='lrow';
    r.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><div class="lav av-b">${ini}</div><div class="lname">${c.nombre}</div></div><div class="lval">${count||0}</div>`;
    act.appendChild(r);
  }
}

async function crearCandidato(){
  const nom=document.getElementById('mc-nom').value.trim();
  const ema=document.getElementById('mc-ema').value.trim();
  if(!nom||!ema){alert('Nombre y email son obligatorios');return;}
  const {error}=await db.from('candidatos').insert({nombre:nom,email:ema,partido:document.getElementById('mc-par').value,cargo:document.getElementById('mc-car').value,telefono:document.getElementById('mc-tel').value,meta_total:parseInt(document.getElementById('mc-met').value)||10000});
  if(error){alert('Error: '+error.message);return;}
  closeModal('mc');
  ['mc-nom','mc-ema','mc-par','mc-car','mc-tel','mc-met'].forEach(id=>document.getElementById(id).value='');
  toast('ok',nom+' creado correctamente');
  loadAdminCands();
}
